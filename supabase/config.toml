project_id = "smart-tap"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://127.0.0.1:4321"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.invite]
subject = "Tu acceso a Smart Tap"
content_path = "./templates/invite.html"

[auth.email.template.recovery]
subject = "Recupera tu acceso a Smart Tap"
content_path = "./templates/recovery.html"

[studio]
enabled = true
port = 54323
